stages:
  - test

unit-test:
  stage: test
  image: node:24.14.0-bookworm-slim
  variables:
    CI: "true"
  before_script:
    - corepack enable
    - corepack prepare pnpm@11.14.0 --activate
  script:
    - pnpm install --frozen-lockfile
    - pnpm test
    - pnpm lint
    - pnpm typecheck
    - pnpm build
